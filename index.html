<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <script src="script.js" defer></script>
    <title>Odin Library App Project</title>
</head>

<body>

    <div class="grid">

        <div class="left-side">
            <h1>Add Book to Library</h1>
            <button id="openModal" class="btnClass">Open New Book Form</button>

            <div id="newBookModal" class="modal">
                <div class="modal-content">
                                            

                    <form id="dataForm" class="modal-form">

                        <h2 class="form-header">Enter Book Info</h2>

                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" required><br><br>
                        <label for="author">Author:</label>
                        <input type="text" id="author" name="author" required><br><br>
                        <label for="pages">Pages:</label>
                        <input type="text" id="pages" name="pages" required><br><br>
                        <label for="read" class="container">Read:</label>
                        <input type="checkbox" id="read" name="read" class="checkmark"><br><br>
                        <button type="submit" class="btnClass">Submit Book to Library</button>
                        
                        <div class="form-header">
                            <span class="close-button">&times;</span>
                        </div>

                    </form>


                </div>
                

            </div>

        </div>

        <div class="right-side">
            <h1>Add Book</h1>
            <button id="new-book-button" class="btnClass">New Book</button>

            <form id="new-book-form" class="new-book" style="display: none;">

                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title">
                </div>

                <div class="form-group">
                    <label for="author">Author:</label>
                    <input type="text" id="author">
                </div>

                <div class="form-group">
                    <label for="pages">Pages:</label>
                    <input type="text" id="pages">
                </div>

                <div class="form-group">
                    <label for="read">Read:</label>
                    <input type="checkbox" id="read">
                </div>

                <div>
                    <input type="submit" value="Submit to Library">
                </div>

                <div>
                    <input type="reset" value="Reset Form">
                </div>
                
            </form>

        </div>

        <div id="library" class="card-section">
            <h1 class="header">Library Stuff</h1>
        </div>


    </div>

    


</body>
</html>
